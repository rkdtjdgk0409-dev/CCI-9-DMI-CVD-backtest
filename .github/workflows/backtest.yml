name: KOSPI CCI-DMI-CVD Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Backtest years"
        required: true
        default: "5"
      top_n:
        description: "Current KOSPI market-cap top N"
        required: true
        default: "200"
      max_positions:
        description: "Maximum concurrent positions"
        required: true
        default: "30"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: |
          python backtest.py \
            --years "${{ inputs.years }}" \
            --top-n "${{ inputs.top_n }}" \
            --max-positions "${{ inputs.max_positions }}"

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: kospi-backtest-results
          path: results/
          retention-days: 30
